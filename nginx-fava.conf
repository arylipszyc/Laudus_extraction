# Story 9.3 — nginx template: basic auth + reverse proxy a Fava.
# Procesado por `envsubst` en el entrypoint ($PORT lo inyecta Render).
# Access log a stdout con timestamp ISO 8601 + auth user + método/path/status (AC7).

daemon off;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
  # AC7: timestamp ISO 8601 + basic-auth user + method + path + status.
  log_format audit '$time_iso8601 user=$remote_user "$request_method $uri" status=$status';
  access_log /dev/stdout audit;

  client_max_body_size 25m;
  proxy_read_timeout 120s;

  server {
    listen ${PORT};
    server_name _;

    location / {
      auth_basic "laudus-fava";
      auth_basic_user_file /tmp/htpasswd;
      proxy_pass http://127.0.0.1:${FAVA_PORT};
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
