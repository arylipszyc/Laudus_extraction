services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: laudus-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    # Standard (2GB/1CPU): el ledger Beancount vive parseado en memoria (~100-250MB,
    # ×2 durante reload) y el plan free (512MB + spin-down 15min) causaba OOM y cold
    # starts de ~1min — decisión Ary 2026-07-06 (review estabilidad).
    plan: standard
    healthCheckPath: /api/v1/health
    envVars:
      # Generated automatically by Render — never commit this value
      - key: JWT_SECRET
        generateValue: true

      # URL of the deployed frontend (update if Render assigns a different slug)
      - key: FRONTEND_URL
        value: https://laudus-frontend.onrender.com

      # ── Google OAuth ────────────────────────────────────────────────────────
      # Set these manually in the Render dashboard after first deploy.
      # Authorized redirect URI to add in Google Cloud Console:
      #   https://laudus-backend.onrender.com/api/v1/auth/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Comma-separated list of allowed users, format: email:role
      # Example: owner@example.com:owner,contador@example.com:contador
      - key: ALLOWED_USERS
        sync: false

      # ── Laudus ERP ───────────────────────────────────────────────────────────
      - key: LAUDUS_USERNAME
        sync: false
      - key: LAUDUS_PASSWORD
        sync: false
      - key: LAUDUS_COMPANYVATID
        sync: false
      # Libro RUT2 / Fondo Común JAB-FGK (Story 12.4) — companyVATId del segundo libro
      - key: LAUDUS_COMPANYVATID_RUT2
        sync: false

  # ── Frontend (React/Vite → nginx static) ──────────────────────────────────
  - type: web
    name: laudus-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # URL of the deployed backend (update if Render assigns a different slug)
      - key: VITE_API_URL
        value: https://laudus-backend.onrender.com
      # Origin del servicio Fava (habilita el deep-link "ver asiento en Fava" del drill-down).
      # Actualizar al valor real que Render asigne a `laudus-fava` tras el primer deploy.
      - key: VITE_FAVA_URL
        value: https://laudus-fava.onrender.com

  # ── Fava (UI contable, nginx basic-auth) — Story 9.3 ───────────────────────
  # Sirve el ledger Beancount de prod detrás de basic-auth; blanco del deep-link del reporte.
  # Sin disco persistente: el entrypoint clona el repo (16MB) al bootear. Plan free (512MB +
  # spin-down); subir a standard si hay OOM sobre el balance de ~18k asientos. NO seteamos
  # healthCheckPath: `/` responde 401 (auth) y Render lo marcaría unhealthy — el check TCP por
  # defecto (puerto abierto) alcanza.
  - type: web
    name: laudus-fava
    runtime: docker
    dockerfilePath: ./Dockerfile.fava
    dockerContext: .
    plan: free
    envVars:
      # Editor con red bean-check (Story 9.0). "false" → Fava read-only (solo ver).
      - key: EDIT_HOOK_ENABLED
        value: "true"
      # Secretos — setear en el dashboard. BEANCOUNT_* son los MISMOS que usa el importer
      # (`laudus-importer-laudus`): copiarlos de ahí. La deploy key necesita WRITE (el editor
      # commitea+pushea los edits del contador).
      - key: BEANCOUNT_REPO_URL
        sync: false
      - key: BEANCOUNT_DEPLOY_KEY
        sync: false
      - key: FAVA_BASIC_AUTH_USER
        sync: false
      - key: FAVA_BASIC_AUTH_PASSWORD
        sync: false
