# Tabla de alias — glosas Laudus -> entidad canónica (E1 §6·B)
# Autora: Valentina · Fecha: 2026-07-23
# Alias ya normalizados (minúscula, sin tilde, espacios colapsados).
# freq_glosa = ocurrencias REALES en el campo desc: del ledger (ledger/imports/laudus + laudus-rut2),
#              salvo nota "(nombres)" = viene de nombres de cuenta, no de glosa.
# PRIMER PASE (seed) del loop de convergencia (arquitectura §6·B.3). Correcto y auditable, no exhaustivo.
#
# PRINCIPIO (arquitectura §6·B.1): la glosa es load-bearing solo para la minoría sin estructura.
# El grueso keyea en el CÓDIGO de cuenta (ej. Tecnión = 310013, socios = 115xxx), inmune a la grafía.
# Esta tabla existe para las cuentas MIXTO (OtrosIngresos 310099) y los tags dispersos por-glosa.

